<app-list
  [title]="'Requisições pendentes'"
  [totalEntities]="applicationStore.totalEntities()"
  [entities]="applicationStore.pendingApplications()"
  [loading]="applicationStore.loading()"
  [showCreationButton]="false"
  [showDetails]="true"
  [showDeletionIcon]="false"
  [showSearch]="true"
  [searchLabel]="'Buscar por CNH (Enter para enviar):'"
  [searchPlaceholder]="'Número da CNH:'"
  [searchInputMode]="'numeric'"
  [searchTrigger]="'enter'"

  (pageChange)="onPageChange($event)"
  (openDetails)="openDetails($event)"
  (searchChanged)="applySearch($event)"
/>
