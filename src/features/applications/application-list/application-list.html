<app-list
  [title]="'Requisições pendentes'"
  [totalEntities]="applicationStore.entities().length"
  [entities]="applicationStore.pendingApplications()"
  [loading]="applicationStore.loading()"
  [showCreationButton]="false"
  [showDetails]="true"
  [showDeletionIcon]="false"

  (pageChange)="onPageChange($event)"
  (openDetails)="openDetails($event)"
/>
