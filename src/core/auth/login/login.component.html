<div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">

    <div class="flex flex-col items-center mb-8">
      <div class="w-20 h-20 bg-green-600 rounded-full flex items-center justify-center shadow-lg mb-4">
        <mat-icon class="text-white scale-150">directions_car</mat-icon>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">IF Ride</h1>
      <p class="text-slate-500 text-sm">Bem-vindo ao portal administrativo</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>E-mail</mat-label>
        <input matInput formControlName="email" placeholder="exemplo@ifgoiano.edu.br">
        <mat-icon matSuffix class="text-slate-400">email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Senha</mat-label>

        <input matInput
               [type]="hidePassword() ? 'password' : 'text'"
               formControlName="password">

        <button mat-icon-button
                matSuffix
                type="button"
                (click)="togglePassword($event)"
                [attr.aria-label]="'Alternar visibilidade da senha'"
                [attr.aria-pressed]="!hidePassword()">

          <mat-icon class="text-slate-400">
            {{ hidePassword() ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>

        <mat-icon matPrefix class="text-slate-400 mr-2">lock</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="primary"
              class="w-full py-6 rounded-xl text-lg font-semibold mt-4 transition-transform active:scale-95"
              [disabled]="loginForm.invalid ">
        {{ 'Entrar' }}
      </button>

    </form>

    <div class="mt-8 text-center">
      <a href="#" class="text-sm text-green-700 hover:underline font-medium">Esqueceu sua senha?</a>
    </div>
  </div>
</div>
